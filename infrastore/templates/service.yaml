apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrastore.fullname" . }}-svc
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    {{- include "labels" . | nindent 4 }}